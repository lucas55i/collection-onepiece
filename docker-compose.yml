version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: onepiece-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: onepiece
      POSTGRES_PASSWORD: onepiece
      POSTGRES_DB: onepiece
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onepiece"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onepiece-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: onepiece
      DB_PASSWORD: onepiece
      DB_NAME: onepiece
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onepiece-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
