server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve arquivos estáticos
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript text/html;

    # Cache para assets
    location ~* \.(css|js|png|jpg|ico)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}
